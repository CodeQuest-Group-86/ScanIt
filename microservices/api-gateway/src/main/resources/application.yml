spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
            allowedHeaders: "*"
      routes:
        # Auth Service — sign-up, sign-in, OTP, password reset
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # Product Service — product catalogue, sellers, prices
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**, /api/v1/sellers/**
          filters:
            - StripPrefix=0

        # Scan Service — AI recognition, scan history
        - id: scan-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/scan/**
          filters:
            - StripPrefix=0

        # Notification Service — SMS/email delivery
        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: INFO
