spring:
  profiles:
    active: dev
  application:
    name: auth-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8081}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 3600000      # 1 hour (ms)
    refresh-token-expiration: 604800000   # 7 days (ms)
  mail:
    from: noreply@scanit.app
  frontend:
    url: http://localhost:19006

# ── Termii — SMS OTP (free signup, no credit card) ────────────────────────────
# Sign up at https://app.termii.com/register
# Dashboard → Settings → API Key
termii:
  api-key: ${TERMII_API_KEY:}
  sender-id: ${TERMII_SENDER_ID:ScanIt}
  channel: ${TERMII_CHANNEL:generic}

# ── Twilio Verify — fallback SMS ──────────────────────────────────────────────
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  verify:
    service-sid: ${TWILIO_VERIFY_SERVICE_SID:}

# ── Resend — Email OTP (3,000 free emails/month) ─────────────────────────────
resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:ScanIt <onboarding@resend.dev>}

---
# ── DEV profile ───────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/authdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  level:
    com.scanit: DEBUG
    org.springframework.security: DEBUG

---
# ── PROD profile ──────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.scanit: INFO
    root: WARN
