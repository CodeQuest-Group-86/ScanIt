spring:
  profiles:
    active: dev
  application:
    name: notification-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8084}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health

# ── Termii — SMS (free, no credit card) ──────────────────────────────────────
# Sign up: https://app.termii.com/register
termii:
  api-key: ${TERMII_API_KEY:}
  sender-id: ${TERMII_SENDER_ID:ScanIt}
  channel: ${TERMII_CHANNEL:generic}

# ── Resend — Email (3,000 free/month) ─────────────────────────────────────────
resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:ScanIt <onboarding@resend.dev>}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/notifdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  level:
    com.scanit: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.scanit: INFO
    root: WARN
