<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScanIt Navigation Mockup</title>
  <style>
    :root {
      --primary: #E8682A;
      --primary-light: #FF8C4A;
      --primary-dark: #C4521A;
      --accent: #1A9ED4;
      --surface: #FAF0E4;
      --text-muted: #A89080;
      --inactive: #8A8A92;
      --phone-metal: #1a1b1e;
      --phone-edge: #2a2c31;
      --screen-bg: #121416;
      --module: #1c1e22;
      --module-border: #2a2d33;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, #3a3d45 0%, #1a1c20 55%, #0c0d0f 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Studio stage */
    .stage {
      position: relative;
      width: 420px;
      height: 760px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 28px;
    }

    /* Soft studio light bloom */
    .stage::before {
      content: "";
      position: absolute;
      inset: 10% 8% 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.08), transparent 65%);
      pointer-events: none;
    }

    /* Phone chassis — macro bottom crop feel */
    .phone {
      position: relative;
      width: 360px;
      height: 680px;
      border-radius: 44px;
      background: linear-gradient(160deg, #2c2e34 0%, #18191d 40%, #0f1012 100%);
      box-shadow:
        0 40px 80px rgba(0,0,0,0.55),
        0 12px 28px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -1px 0 rgba(0,0,0,0.5),
        inset 1px 0 0 rgba(255,255,255,0.06),
        inset -1px 0 0 rgba(0,0,0,0.3);
      padding: 12px;
      overflow: hidden;
    }

    /* Metal bezel ring */
    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 44px;
      border: 1.5px solid rgba(255,255,255,0.12);
      pointer-events: none;
      z-index: 5;
    }

    /* Glass edge highlight */
    .phone::after {
      content: "";
      position: absolute;
      top: 8px;
      left: 18%;
      right: 18%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      z-index: 6;
      pointer-events: none;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 34px;
      background: linear-gradient(180deg, #1a1c20 0%, #0e0f12 55%, #0a0b0d 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    /* Content area above nav */
    .content {
      flex: 1;
      padding: 48px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .module {
      flex: 1;
      border-radius: 18px;
      background: linear-gradient(145deg, #22252b 0%, #16181c 100%);
      border: 1px solid var(--module-border);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 8px 20px rgba(0,0,0,0.25);
      position: relative;
      overflow: hidden;
    }

    .module::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
      pointer-events: none;
    }

    /* Subtle placeholder lines in modules */
    .module-inner {
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .line {
      height: 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
    }
    .line.short { width: 42%; }
    .line.med { width: 68%; }
    .line.long { width: 88%; }

    .chip-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .chip {
      height: 22px;
      width: 64px;
      border-radius: 11px;
      background: rgba(232, 104, 42, 0.12);
      border: 1px solid rgba(232, 104, 42, 0.18);
    }
    .chip.blue {
      background: rgba(26, 158, 212, 0.12);
      border-color: rgba(26, 158, 212, 0.18);
    }

    /* Bottom navigation bar */
    .nav-wrap {
      padding: 0 12px 22px;
      position: relative;
      z-index: 2;
    }

    .nav {
      display: grid;
      grid-template-columns: 1fr 1fr 1.15fr 1fr 1fr;
      align-items: end;
      gap: 2px;
      height: 72px;
      padding: 10px 8px 12px;
      border-radius: 26px;
      background: linear-gradient(180deg, #252830 0%, #1a1c22 55%, #14161a 100%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 10px 28px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.1),
        inset 0 -1px 0 rgba(0,0,0,0.35);
      position: relative;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      color: var(--inactive);
      min-height: 48px;
      padding-bottom: 2px;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item span {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1;
      color: inherit;
    }

    /* Center Scan FAB */
    .nav-item.scan {
      position: relative;
      justify-content: center;
      padding-bottom: 0;
      top: -18px;
    }

    .scan-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary-light) 0%, var(--primary) 48%, var(--primary-dark) 100%);
      box-shadow:
        0 8px 22px rgba(232, 104, 42, 0.55),
        0 2px 6px rgba(196, 82, 26, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 -2px 4px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.18);
    }

    .scan-btn svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .scan-btn .scan-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
      line-height: 1;
    }

    /* Home indicator / speaker chin area */
    .chin {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 4px 0 2px;
    }

    .speaker {
      width: 72px;
      height: 5px;
      border-radius: 3px;
      background: linear-gradient(180deg, #0a0a0c, #2a2c30);
      box-shadow:
        inset 0 1px 2px rgba(0,0,0,0.8),
        0 0.5px 0 rgba(255,255,255,0.08);
      margin-top: 2px;
    }

    .home-bar {
      width: 108px;
      height: 4px;
      border-radius: 3px;
      background: rgba(255,255,255,0.28);
      margin-bottom: 6px;
    }

    /* Side buttons (metal) */
    .btn-vol {
      position: absolute;
      left: -3px;
      top: 160px;
      width: 4px;
      height: 52px;
      border-radius: 2px 0 0 2px;
      background: linear-gradient(180deg, #3a3c42, #1e2024);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .btn-vol.down { top: 222px; height: 44px; }
    .btn-power {
      position: absolute;
      right: -3px;
      top: 190px;
      width: 4px;
      height: 70px;
      border-radius: 0 2px 2px 0;
      background: linear-gradient(180deg, #3a3c42, #1e2024);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }

    /* Brand caption under stage for export context */
    .caption {
      position: absolute;
      bottom: -36px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="btn-vol"></div>
      <div class="btn-vol down"></div>
      <div class="btn-power"></div>

      <div class="screen">
        <div class="content">
          <div class="module">
            <div class="module-inner">
              <div class="line long"></div>
              <div class="line med"></div>
              <div class="line short"></div>
              <div class="chip-row">
                <div class="chip"></div>
                <div class="chip blue"></div>
              </div>
            </div>
          </div>
          <div class="module">
            <div class="module-inner">
              <div class="line med"></div>
              <div class="line long"></div>
              <div class="line short"></div>
              <div class="line med"></div>
            </div>
          </div>
        </div>

        <div class="nav-wrap">
          <nav class="nav" aria-label="Bottom navigation">
            <!-- Home -->
            <div class="nav-item">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/>
              </svg>
              <span>Home</span>
            </div>

            <!-- History -->
            <div class="nav-item">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 3.5h8.5L19 7v13.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/>
                <path d="M15.5 3.5V7H19"/>
                <path d="M9 11h6M9 14.5h6M9 18h4"/>
              </svg>
              <span>History</span>
            </div>

            <!-- Scan (active) -->
            <div class="nav-item scan">
              <div class="scan-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <!-- scan brackets -->
                  <path d="M7 5H5v2M17 5h2v2M7 19H5v-2M17 19h2v-2"/>
                  <path d="M8 12h8"/>
                </svg>
                <span class="scan-label">Scan</span>
              </div>
            </div>

            <!-- Wallet -->
            <div class="nav-item">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3.5" y="6.5" width="17" height="12" rx="2"/>
                <path d="M3.5 10h17"/>
                <circle cx="16.5" cy="14.5" r="1.2" fill="currentColor" stroke="none"/>
              </svg>
              <span>Wallet</span>
            </div>

            <!-- Profile -->
            <div class="nav-item">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="9" r="3.2"/>
                <path d="M5.5 19.5c1.4-3.2 3.6-4.8 6.5-4.8s5.1 1.6 6.5 4.8"/>
              </svg>
              <span>Profile</span>
            </div>
          </nav>

          <div class="chin">
            <div class="speaker"></div>
            <div class="home-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="caption">ScanIt · Primary #E8682A</div>
  </div>
</body>
</html>
