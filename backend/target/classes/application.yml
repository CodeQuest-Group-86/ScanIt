spring:
  profiles:
    active: dev
  application:
    name: scanit-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 3600000      # 1 hour  (ms)
    refresh-token-expiration: 604800000   # 7 days  (ms)
  mail:
    from: noreply@scanit.app
  frontend:
    url: http://localhost:19006

# ── Termii — SMS OTP (PREFERRED — free signup, no credit card) ────────────────
# Sign up free at https://app.termii.com/register
# Dashboard → Settings → API Key → copy your key
# Free trial balance included on signup. Pay-as-you-go after.
termii:
  api-key: ${TERMII_API_KEY:}
  sender-id: ${TERMII_SENDER_ID:ScanIt}
  channel: ${TERMII_CHANNEL:generic}   # use "generic" or "dnd"

# ── Twilio Verify — SMS OTP (fallback, requires trial credit / card) ──────────
# Only used when ARKESEL_API_KEY is NOT set.
# Sign up at https://www.twilio.com/try-twilio
# Verify → create a service → copy Service SID
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  verify:
    service-sid: ${TWILIO_VERIFY_SERVICE_SID:}

# ── Resend — Email OTP (free tier: 3,000 emails/month) ────────────────────────
# Sign up at https://resend.com → API Keys → Create key
resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:ScanIt <onboarding@resend.dev>}

# ── Gemini Vision (product ID + price research) ───────────────────────────────
# Get a free key at: https://aistudio.google.com/app/apikey
gemini:
  api-key: ${GEMINI_API_KEY:}

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
