spring:
  datasource:
    # Render's Blueprint wires DB_HOST/DB_PORT/DB_NAME from its managed Postgres instance
    # (see render.yaml). Set DATABASE_URL directly instead if deploying elsewhere.
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: public

app:
  jwt:
    secret: ${JWT_SECRET}
  frontend:
    url: ${FRONTEND_URL:https://scanit.app}

logging:
  level:
    com.scanit: INFO
    root: WARN
