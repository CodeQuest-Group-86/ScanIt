spring:
  profiles:
    active: dev
  application:
    name: scanit-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 3600000      # 1 hour  (ms)
    refresh-token-expiration: 604800000   # 7 days  (ms)
  mail:
    from: noreply@scanit.app
  frontend:
    url: http://localhost:19006

# ── Twilio Verify — SMS OTP (free trial) ──────────────────────────────────────
# Sign up at https://www.twilio.com/try-twilio
# Verify → create a service → copy Service SID
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  verify:
    service-sid: ${TWILIO_VERIFY_SERVICE_SID:}

# ── Resend — Email OTP (free tier: 3,000 emails/month) ────────────────────────
# Sign up at https://resend.com → API Keys → Create key
resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:ScanIt <onboarding@resend.dev>}

# ── Paystack — subscription payments ───────────────────────────────────────────
# Only the SECRET key lives on the backend — it's what verifies transactions server-side.
# The PUBLIC key goes in the app's EXPO_PUBLIC_PAYSTACK_PUBLIC_KEY instead (safe to ship).
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}

# ── Google Sign-In — OAuth client IDs (one per platform, all issued from the same
# Google Cloud OAuth consent screen). Blank until configured — AuthService.googleSignIn
# rejects the request (not a boot failure) when none are set. ─────────────────────────
google:
  oauth:
    web-client-id: ${GOOGLE_OAUTH_WEB_CLIENT_ID:}
    ios-client-id: ${GOOGLE_OAUTH_IOS_CLIENT_ID:}
    android-client-id: ${GOOGLE_OAUTH_ANDROID_CLIENT_ID:}
