spring:
  profiles:
    active: dev
  application:
    name: scanit-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-use-env-var}
    access-token-expiration: 3600000      # 1 hour  (ms)
    refresh-token-expiration: 604800000   # 7 days  (ms)
  frontend:
    url: http://localhost:19006

# ── Resend — all app email: OTP codes + password-reset links (free tier: 3,000/mo) ──
# Sign up at https://resend.com → API Keys → Create key
resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:ScanIt <onboarding@resend.dev>}

# ── Gemini Vision — product identification (free tier: 1,500 requests/day) ──────
# Get a free key: https://aistudio.google.com/app/apikey
gemini:
  api-key: ${GEMINI_API_KEY:}

# ── SerpAPI — live price comparison / where-to-buy (free tier: 100 searches/mo) ─
# Sign up at https://serpapi.com → copy your private API key
serpapi:
  api-key: ${SERPAPI_API_KEY:}

# ── Cloudinary — scan photo storage (free tier: 25 monthly credits) ─────────────
# Sign up at https://cloudinary.com → Dashboard for cloud name / API key / secret
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ── Paystack — subscription payments ───────────────────────────────────────────
# Only the SECRET key lives on the backend — it's what verifies transactions server-side.
# The PUBLIC key goes in the app's EXPO_PUBLIC_PAYSTACK_PUBLIC_KEY instead (safe to ship).
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}
