spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    # Must be valid Base64 — JwtService decodes it, not use as a raw string.
    secret: dGVzdE9ubHlKd3RTZWNyZXRGb3JTY2FuSXRCYWNrZW5kVW5pdFRlc3RzRG9Ob3RVc2VJblByb2R1Y3Rpb24=
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000
